name: CI Pipeline con Pruebas Automatizadas

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: "Build and Unit Tests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar pnpm
        run: npm install -g pnpm

      - name: Instalación de dependencias
        run: pnpm install --config.production=false

      - name: Etapa 1: Compilación (Build)
        run: npx nest build

      - name: Etapa 2: Pruebas Unitarias y Cobertura (Quality Gate)
        run: npx jest --coverage

      - name: Etapa 3: Publicar Reporte de Cobertura como Artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn

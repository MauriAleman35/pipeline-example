name: CI Pipeline con Pruebas Automatizadas

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Instalación de dependencias
        run: pnpm install

      - name: Etapa 1: Compilación (Build)
        run: pnpm run build

      - name: Etapa 2: Pruebas Unitarias y Cobertura (Quality Gate)
        run: pnpm run test:cov

      - name: Etapa 3: Publicar Reporte de Cobertura como Artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
